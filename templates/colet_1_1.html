
<!DOCTYPE html><html lang="ro"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Trimite colet ieftin</title>
<style>body{font-family:Arial;padding:20px;max-width:500px;margin:auto} input{width:100%;padding:10px;margin:8px 0;border:1px solid #ccc;border-radius:8px} button{background:#16a34a;color:#fff;padding:12px;border:none;border-radius:10px;width:100%;font-weight:700}</style>
</head><body>
<h2>Trimite colet mic ieftin</h2><p>Max 5kg, 60x40x40cm. Pret estimat: 10 lei + 0.4 lei/km, max 30 lei. Plic 12 lei.</p>
<form method="post">
<input name="nume" placeholder="Nume" required>
<input name="telefon" placeholder="Telefon" required>
<input name="de_unde" placeholder="De unde: ex: Ulmi, DB" required>
<input name="pana_unde" placeholder="Până unde: ex: Titu, DB" required>
<input name="greutate" placeholder="Greutate kg: ex: 0.3 pentru plic, 2 pentru colet" required>
<button type="submit">Cere transport</button>
</form><p><a href="/">← înapoi</a></p>
</body></html>
