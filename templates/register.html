{% extends "base.html" %}
{% block content %}
<h2>Creeaza cont - gratis</h2>
<p>Poti sa te loghezi ulterior cu telefon SAU email, cum vrei tu.</p>
<form method="post" class="card">
<label>Nume complet</label><input name="nume" required placeholder="Ex: Ion Popescu">
<label>Telefon (cu sau fara +40)</label><input name="telefon" placeholder="07xx xxx xxx">
<label>Email (optional, daca vrei logare cu email)</label><input name="email" type="email" placeholder="ion@email.com">
<label>Parola</label><input name="parola" type="password" required minlength="6">
<label>Vrei sa fii:</label><select name="rol"><option value="ambele">Sofer + Expeditor</option><option value="sofer">Doar sofer</option><option value="client">Doar expeditor</option></select>
<button class="btn" type="submit">Creeaza cont</button>
<p style="margin-top:12px">Ai deja cont? <a href="/login">Intra in cont</a></p>
</form>
{% endblock %}
