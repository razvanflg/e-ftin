{% extends "base.html" %}
{% block content %}
<h2>Intra in cont</h2>
<p>Poti folosi <b>telefonul</b> sau <b>emailul</b> - cum ai setat la inregistrare.</p>
<form method="post" class="card">
<label>Telefon sau Email</label><input name="identifier" required placeholder="07xx xxx xxx sau emailul tau">
<label>Parola</label><input name="parola" type="password" required>
<button class="btn" type="submit">Intra in cont</button>
<p style="margin-top:12px">Nu ai cont? <a href="/register">Fa-ti cont</a></p>
</form>
{% endblock %}
