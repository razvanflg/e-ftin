{% extends "base.html" %}{% block content %}<div class="card"><h2>🚐 Pune-ți ruta - cu orașe intermediare</h2><form method="POST"><div class="autocomplete"><label>Plecare (scrie 2 litere și alege):</label><input id="plecare" name="plecare" required placeholder="ex: Rm Valcea"><div id="list-plecare" class="autocomplete-list"></div></div><div class="autocomplete"><label>Sosire:</label><input id="sosire" name="sosire" required placeholder="ex: Bucuresti"><div id="list-sosire" class="autocomplete-list"></div></div><div class="autocomplete"><label>Orașe intermediare prin care treci (opțional, separate cu virgulă):</label><input id="traseu" name="traseu" placeholder="ex: Pitesti, Găești, Titu"><div id="list-traseu" class="autocomplete-list"></div><small style="color:#16a34a">💡 Adaugă orașe ca să faci match cu mai multe colete! Ex: Rm Vâlcea → Pitești → București face match și cu colete Pitești → București!</small></div><label>data:[STRIPPED]label><input type="date" name="data_ruta" required><label>Ora:</label><input type="time" name="ora" required><label>Locuri colete:</label><input type="number" name="locuri" value="3" min="1" max="5"><label>Detalii:</label><textarea name="detalii" placeholder="ex: Plecare din centru, portbagaj mare, accept plicuri"></textarea><button class="btn">🚀 Publică ruta</button></form></div>{% endblock %}
