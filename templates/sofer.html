{% extends "base.html" %}
{% block content %}
<h2>Adauga ruta de azi - Sofer</h2>
<form method="post" class="card">
<label>De unde pleci?</label><input name="de_unde" required placeholder="Ex: Moreni, Târgoviște">
<label>Pana unde mergi?</label><input name="pana_unde" required placeholder="Ex: Râmnicu Vâlcea">
<label>Data</label><input name="data_ruta" type="date" required>
<label>Ora plecarii</label><input name="ora" type="time" required>
<label>Locuri libere pe bancheta (max 5 colete)</label><select name="locuri"><option>1</option><option>2</option><option>3</option><option>4</option><option>5</option></select>
<label>Detalii (optional)</label><textarea name="detalii" placeholder="Ex: Trec prin Titu, Potlogi, nu fac abatere, portbagaj liber"></textarea>
<button class="btn" type="submit">Publica ruta - gratis</button>
</form>
{% endblock %}
