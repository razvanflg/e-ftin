{% extends "base.html" %}
{% block content %}
<h2>Posteaza colet - Expeditor</h2>
<form method="post" class="card">
<label>De unde?</label><input name="de_unde" required placeholder="Ex: Titu">
<label>Pana unde?</label><input name="pana_unde" required placeholder="Ex: Potlogi">
<label>Ce contine? (fara fragile/perisabile)</label><input name="ce_contine" required placeholder="Ex: Acte, chei, incarcator">
<label>Tip</label><select name="tip"><option value="colet">Colet (max 5kg, 60x40x40)</option><option value="plic">Plic (12 lei fix)</option></select>
<label>Greutate aprox</label><input name="greutate" placeholder="Ex: 1kg">
<label>Telefonul tau de contact (pt WhatsApp sofer)</label><input name="telefon_contact" required placeholder="07xx xxx xxx">
<div style="background:#f0fdf4;padding:12px;border-radius:12px;margin:12px 0">
<b>Pret automat:</b> Plic 12 lei fix. Colet 10 lei + 0,40 lei/km - max 30 lei plafonat. Soferul pastreaza 100%.
</div>
<button class="btn" type="submit">Posteaza colet - vezi soferi</button>
</form>
{% endblock %}
