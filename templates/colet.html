{% extends "base.html" %}{% block content %}<div class="card"><h2>📦 Cere transport colet - cu sugestii localități</h2><form method="POST"><div class="autocomplete"><label>Plecare (scrie 2 litere):</label><input id="plecare" name="plecare" required placeholder="ex: Rm Valcea"><div id="list-plecare" class="autocomplete-list"></div></div><div class="autocomplete"><label>Sosire:</label><input id="sosire" name="sosire" required placeholder="ex: Bucuresti"><div id="list-sosire" class="autocomplete-list"></div></div><label>Greutate kg:</label><input type="number" step="0.1" name="greutate" value="2" required><label>Ce conține (fără valori, perisabile):</label><textarea name="descriere" required placeholder="ex: haine, acte, plic, cadou"></textarea><button class="btn">📦 Publică coletul - 12-20 lei</button></form><p><small>💚 Plic &lt;1kg = 12 lei fix. Colet = 20 lei. Șoferul păstrează 100%. Max 5kg.</small></p></div>{% endblock %}
